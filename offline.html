<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080b0d">
  <title>اتصال اینترنت برقرار نیست | Offline</title>
  <link rel="stylesheet" href="/assets/css/flow-field-background.min.css?v=95">
  <style>
    :root { --bg:#080b0d; --panel:rgba(20,28,29,.78); --line:rgba(235,255,223,.14); --text:#f1f8ef; --muted:rgba(232,247,232,.62); --accent:#a8ff46; }
    * { box-sizing:border-box; }
    body { display:grid; place-items:center; min-height:100vh; margin:0; padding:24px;
           background:radial-gradient(circle at 12% 10%,rgba(72,160,122,.14),transparent 26rem),var(--bg);
           color:var(--text); font-family:"IRANSansX","Estedad","Inter",system-ui,sans-serif; line-height:1.8; }
    .card { position:relative; z-index:1; width:100%; max-width:440px; padding:34px 28px; border:1px solid var(--line); border-radius:22px;
            background:var(--panel); box-shadow:0 20px 60px rgba(0,0,0,.34); text-align:center; }
    .mark { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 20px; border-radius:18px;
            border:1px solid var(--line); background:rgba(168,255,70,.08); }
    h1 { margin:0 0 10px; font-size:22px; }
    p { margin:0 0 8px; color:var(--muted); font-size:14px; }
    .en { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; }
    button { margin-top:22px; min-height:46px; padding:0 26px; border:1px solid var(--accent); border-radius:999px;
             background:var(--accent); color:#0b120c; font:inherit; font-size:14px; font-weight:700; cursor:pointer;
             transition:transform .2s ease, box-shadow .2s ease; }
    button:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(168,255,70,.24); }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    a { color:var(--accent); }
    @media (prefers-reduced-motion:reduce) { button { transition:none; } button:hover { transform:none; } }
  </style>
</head>
<body>
<script>/* Theme boot — runs before paint so a page never flashes the wrong theme on navigation. Mirrors main.js: stored choice wins, then data-default-mode, then light. `light` is the class portfolio.js uses. */(function(){try{var s=localStorage.getItem("darkMode"),d;if(s!==null){d=s==="enabled";}else{d=document.body.getAttribute("data-default-mode")==="dark";}document.body.classList.toggle("dark-mode",d);document.body.classList.toggle("light",!d);document.documentElement.setAttribute("data-kdcv-theme",d?"dark":"light");}catch(e){}})();</script>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#a8ff46" stroke-width="1.8" stroke-linecap="round">
        <path d="M1 1l22 22"/><path d="M16.7 13.7a5 5 0 0 0-6.4-.7"/><path d="M5 12.5a10 10 0 0 1 3.5-2.3"/>
        <path d="M2 8.8a15 15 0 0 1 5-3.1"/><path d="M22 8.8a15 15 0 0 0-8.6-3.8"/><path d="M12 20h.01"/>
      </svg>
    </div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>به نظر می‌رسد دستگاه شما آفلاین است. صفحاتی که قبلاً باز کرده‌اید همچنان در دسترس‌اند.</p>
    <p>پس از برقراری اتصال، دوباره تلاش کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
    <div class="en" lang="en" dir="ltr">
      <strong>You’re offline.</strong>
      <p style="margin-top:6px">Pages you visited earlier are still available. Reconnect and try again.</p>
    </div>
  </main>
  <script src="/assets/js/flow-field-background.min.js?v=95" defer></script>
</body>
</html>
