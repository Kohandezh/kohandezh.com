<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="100%" height="100%" fill="white"/><rect x="230" y="65" width="1140" height="125" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="800.0" y="127.5" fill="#163952" font-size="37" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">ارزیابی آسیب‌پذیری و اثر عملیاتی</text><polyline points="800,190 800,270" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="800,270 791.7356548518866,252.89150505529915 808.2643451481134,252.89150505529915" fill="#147D85"/><rect x="230" y="270" width="1140" height="125" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="800.0" y="332.5" fill="#163952" font-size="37" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">شناسایی، دریافت و بررسی اصالت وصله</text><polyline points="800,395 800,475" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="800,475 791.7356548518866,457.89150505529915 808.2643451481134,457.89150505529915" fill="#147D85"/><rect x="230" y="475" width="1140" height="125" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="800.0" y="537.5" fill="#163952" font-size="37" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">آزمون سازگاری، ایمنی و امکان بازیابی</text><polyline points="800,600 800,680" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="800,680 791.7356548518866,662.8915050552991 808.2643451481134,662.8915050552991" fill="#147D85"/><rect x="230" y="680" width="1140" height="125" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="800.0" y="742.5" fill="#163952" font-size="37" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">مجوز تغییر و استقرار در زمان مناسب</text><polyline points="800,805 800,885" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="800,885 791.7356548518866,867.8915050552991 808.2643451481134,867.8915050552991" fill="#147D85"/><rect x="230" y="885" width="1140" height="125" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="800.0" y="947.5" fill="#163952" font-size="37" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">تأیید پس از استقرار و ثبت شواهد</text><text x="800.0" y="1155.0" fill="#566775" font-size="29" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">طرح آموزشی نویسنده؛ تصمیم به نصب و تدابیر جایگزین باید بر اساس ریسک باشد.</text></svg>