<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200"><rect width="100%" height="100%" fill="white"/><rect x="50" y="80" width="500" height="160" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="300.0" y="139.7" fill="#163952" font-size="29" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">محرک‌ها</text><text x="300.0" y="180.29999999999998" fill="#163952" font-size="29" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">تغییر فرایند، آسیب‌پذیری یا بازبینی دوره‌ای</text><rect x="680" y="80" width="940" height="160" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="1150.0" y="160.0" fill="#163952" font-size="35" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">بازبینی امنیت و بررسی اثر بر سطح محقق‌شده</text><polyline points="550,160 680,160" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="680,160 662.8915050552991,168.26434514811336 662.8915050552991,151.73565485188664" fill="#147D85"/><rect x="680" y="350" width="940" height="150" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="1150.0" y="401.9" fill="#163952" font-size="33" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">بررسی و آزمون وصله‌ها</text><text x="1150.0" y="448.09999999999997" fill="#163952" font-size="33" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">در محیط آفلاین یا نمایندهٔ محیط عملیاتی</text><polyline points="1150,240 1150,350" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="1150,350 1141.7356548518867,332.89150505529915 1158.2643451481133,