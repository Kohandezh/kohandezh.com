"/><polygon points="1150,840 1141.7356548518867,822.8915050552991 1158.2643451481133,822.8915050552991" fill="#147D85"/><polyline points="300,840 300,290 680,290 680,185" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="680,185 688.2643451481134,202.10849494470085 671.7356548518866,202.10849494470085" fill="#147D85"/><text x="850.0" y="1155.0" fill="#566775" font-size="29" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">وجود وصله به‌معنای نصب فوری نیست؛ اثر بر ایمنی و تداوم عملیات بررسی می‌شود.</text></svg>