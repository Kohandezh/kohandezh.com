:plaintext">یکپارچه‌ساز سیستم</text><rect x="50" y="1025" width="385" height="140" rx="15" fill="#EDF5F7" stroke="#147D85" stroke-width="2"/><text x="242.5" y="1095.0" fill="#163952" font-size="33" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">تأمین‌کنندهٔ محصول</text><polyline points="435,280 600,280" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="600,280 582.8915050552991,288.26434514811336 582.8915050552991,271.73565485188664" fill="#147D85"/><polyline points="435,605 600,605" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="600,605 582.8915050552991,613.2643451481134 582.8915050552991,596.7356548518866" fill="#147D85"/><text x="280" y="455.0" fill="#163952" font-size="28" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">طراحی و استقرار</text><rect x="530" y="950" width="1100" height="285" rx="15" fill="#F8F4DF" stroke="#AA690B" stroke-width="2"/><text x="1080" y="1000.0" fill="#163952" font-size="35" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">محصول سیستم کنترل</text><text x="1080" y="1090.0" fill="#163952" font-size="30" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">برنامه‌های پشتیبان، دستگاه‌های تعبیه‌شده،</text><text x="1080" y="1150.0" fill="#163952" font-size="30" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">اجزای میزبان و تجهیزات شبکه</text><polyline points="435,1095 530,1095" fill="none" stroke="#147D85" stroke-width="4"/><polygon points="530,1095 512.8915050552991,1103.2643451481133 512.8915050552991,1086.7356548518867" fill="#147D85"/><text x="850.0" y="1305.0" fill="#566775" font-size="29" font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" dominant-baseline="central" direction="rtl" style="unicode-bidi:plaintext">محصول توسعه می‌یابد؛ نمونهٔ پیکربندی‌شدهٔ آن در راهکار اتوماسیون به کار می‌رود.</text></svg>