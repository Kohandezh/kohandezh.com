<svg width="40" height="40" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MK">
  <!-- Vector of the kohandezh.com brand mark: dark rounded tile, lime-white
       MK ligature (the M's right stem doubles as the K's stem) and the green
       accent slab in the M's valley. Matches logo.png / the favicons so the
       light and dark variants are the SAME mark. -->
  <defs>
    <linearGradient id="mk-tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171D1B"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <linearGradient id="mk-accent" x1="200" y1="270" x2="255" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9FF8A"/>
      <stop offset="1" stop-color="#4FD35F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#mk-tile)"/>
  <path d="M262 268 205 380 258 380 258 268Z" fill="url(#mk-accent)"/>
  <g fill="none" stroke="#F0FFDE" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 372V174l79 100 79-100v198"/>
    <path d="M284 268 396 156M284 268l112 112"/>
  </g>
</svg>
